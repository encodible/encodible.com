server {
  listen 80;
  listen [::]:80;
  server_name encodible.com www.encodible.com;
  client_max_body_size 15m;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name encodible.com www.encodible.com;
  client_max_body_size 15m;

  ssl_certificate /etc/ssl/encodible/fullchain.pem;
  ssl_certificate_key /etc/ssl/encodible/domain.key;
  ssl_trusted_certificate /etc/ssl/encodible/ca-bundle.pem;
  root /var/www/encodible.com/current;
  index index.html;

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /feb-2026-ai-event-01 {
    return 301 https://encodible.com/;
  }

  location = /feb-2026-ai-event-01/ {
    return 301 https://encodible.com/;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri /index.html;
  }
}
