server {
  listen 80;
  listen [::]:80;
  server_name alcomatcher.com www.alcomatcher.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://encodible.com/;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name alcomatcher.com www.alcomatcher.com;

  ssl_certificate /etc/letsencrypt/live/alcomatcher.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/alcomatcher.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://encodible.com/;
}
