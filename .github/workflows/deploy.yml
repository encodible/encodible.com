name: Verify and deploy

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encodible-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  deploy:
    name: Deploy production
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://encodible.com
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_ed25519

      - name: Deploy exact merged commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_USER"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          deploy_path=$1
          deploy_sha=$2

          cd "$deploy_path"
          test -z "$(git status --porcelain)"
          git fetch --prune origin master
          git checkout master
          git merge --ff-only "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"

          docker compose up -d --build --remove-orphans

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail 100
          exit 1
          REMOTE

      - name: Verify public routes and TLS
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --dump-header /tmp/encodible-home.headers \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://encodible.com/ > /tmp/encodible-home.html
          curl --fail --show-error --silent \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://encodible.com/robots.txt > /tmp/encodible-robots.txt
          read -r event_status event_redirect <<< "$(curl --show-error --silent --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            --connect-timeout 10 --max-time 30 \
            https://encodible.com/feb-2026-ai-event-01)"
          grep --quiet '<div id="root"></div>' /tmp/encodible-home.html
          grep --quiet 'Digital Identity & Trust Systems Consulting' /tmp/encodible-home.html
          grep --ignore-case --quiet '^cache-control: no-cache, no-store, must-revalidate' /tmp/encodible-home.headers
          grep --quiet 'Sitemap: https://encodible.com/sitemap.xml' /tmp/encodible-robots.txt
          test "$event_status" = "301"
          test "$event_redirect" = "https://encodible.com/"
